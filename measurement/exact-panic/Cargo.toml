[package]
name = "filament-contract-runtime-exact-panic"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]
test = false
bench = false

[dependencies]
filament-contract-runtime = { path = "../..", default-features = false, features = ["exact"] }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "a58474cc105a86f3307a11def3fc001e2459679f", default-features = false }
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "31d807ccb8ffd5a88beb0b1a570b80acb099f5e9", default-features = false }
