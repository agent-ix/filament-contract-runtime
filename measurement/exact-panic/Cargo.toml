[package]
name = "filament-contract-runtime-exact-panic"
version = "0.0.0"
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[lib]
crate-type = ["staticlib"]

[dependencies]
filament-contract-runtime = { path = "../..", default-features = false, features = ["exact"] }
filament-exact = { git = "https://github.com/agent-ix/filament-exact", branch = "main", default-features = false }
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", branch = "main", default-features = false }
