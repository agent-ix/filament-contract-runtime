[package]
name = "filament-contract-runtime"
version = "0.1.1"
edition = "2021"
rust-version = "1.98.1"
description = "Small no_std runtime support for generated contract oracles and harness verdicts."
authors = ["Peter Krenesky <kreneskyp@gmail.com>"]
license = "AGPL-3.0-or-later"
publish = false
repository = "https://github.com/agent-ix/filament-contract-runtime"

[lib]
name = "filament_contract_runtime"
path = "src/lib.rs"

[[bin]]
name = "exact_deep_value_type_child"
path = "tests/support/exact_deep_value_type_child.rs"
required-features = ["exact"]
test = false

[workspace]
members = ["measurement/footprint", "measurement/exact-panic", "tools/kernel-api-check", "tools/runtime-gates"]
resolver = "2"

[features]
default = []
alloc = []
std = ["alloc"]
proptest = ["std", "dep:proptest"]
snapshot-json = ["alloc", "dep:serde", "dep:serde_json"]
exact = ["alloc", "dep:filament-exact", "dep:filament-semantic-value"]

[dependencies]
# These packages exchange types; matching exact revisions preserve shared type identity.
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616", optional = true, default-features = false }
filament-semantic-value = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "1df71c27e6db56c8118cf017689aa7fab6156cde", optional = true, default-features = false }
proptest = { version = "1.5.0", optional = true, default-features = false, features = ["std"] }
serde = { version = "1.0.228", optional = true, default-features = false, features = ["alloc"] }
serde_json = { version = "1.0.151", optional = true, default-features = false, features = ["alloc"] }

[dev-dependencies]
fsv-failing-allocator = { git = "https://github.com/agent-ix/filament-semantic-value", rev = "1df71c27e6db56c8118cf017689aa7fab6156cde" }
# The kernel's ordered charge log (`Meter::admitted_charges`) exists only under its
# `test-support` feature, which only a dev dependency may enable: the residue tests assert the
# charge sequences of the operations the runtime still defines.
filament-exact = { git = "https://github.com/agent-ix/filament-exact", rev = "b26a8e4c592503fccdc4a0e3d2cce23dd8487616", default-features = false, features = ["test-support"] }
proptest = { version = "1.5.0", default-features = false, features = ["std"] }
serde_json = "1.0.151"
ix-trace-rs = { version = "0.1", git = "https://github.com/agent-ix/ix-trace-rs", tag = "v0.1.2" }
filament-specification-qualification = { git = "https://github.com/agent-ix/filament-specification", tag = "v0.1.0" }
proc-macro2 = { version = "1", features = ["span-locations"] }
syn = { version = "2", features = ["full", "visit"] }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.exact-panic]
inherits = "release"
lto = false
codegen-units = 16

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

# CBMC tracks heap objects field-by-field only up to 64 bytes by default;
# `ValueType`, `Value` and `FunctionDeclaration` are larger, and a
# non-field-sensitive read of them cannot be constant-folded.
[package.metadata.kani]
unstable = { unstable-options = true }
flags = { cbmc-args = ["--max-field-sensitivity-array-size", "1024"] }
